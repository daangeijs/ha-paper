# Weekly update PRs. Minor + patch bumps are grouped into one PR per ecosystem; majors come one PR each.
# Workflow actions are pinned to commit SHAs (`@<sha> # vX.Y.Z`); Dependabot updates both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /emulator
    schedule:
      interval: monthly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /firmware
    schedule:
      interval: monthly
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
