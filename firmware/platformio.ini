; HA Paper firmware. `pio run -e x4pro` = device image, `pio test -e native` = host tests.
[platformio]
default_envs = x4pro

[env:x4pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; buildfs/uploadfs target the `www` partition (web console); `userdata` is never imaged (partitions.csv)
board_build.filesystem_partition = www
; X4 Pro flash is wired DIO with octal PSRAM (docs/HARDWARE.md)
board_build.arduino.memory_type = dio_opi
; Gzips the device web console (emulator/dist-device-ui) into data/www before `pio run -t buildfs` → www.bin
extra_scripts = pre:scripts/build_ui.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DFREEINK_DEVICE_X4PRO=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DX4_FW_VERSION=\"${sysenv.X4_FW_VERSION}\"
  ; GitHub repo checked for OTA releases (a fork sets its own "<owner>/ha-paper").
  -DX4_OTA_REPO=\"daangeijs/ha-paper\"
  ; AsyncTCP runs every web handler (YAML parse for PUT /config, OTA upload). 10 KB, internal RAM (#248): peak use
  ; 4.7 KB in QEMU (20 PUTs of a 10-screen config + a full OTA upload), 840 B on the X4 Pro in normal use.
  -DCONFIG_ASYNC_TCP_STACK_SIZE=10240
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  ; ArduinoJson caps strings at 65535 B on 32-bit; HA's render_template answer for 800 entities is one ~75 KB string (#57)
  -DARDUINOJSON_STRING_LENGTH_SIZE=4
  ; net/diag.cpp keeps the panic message in RTC memory for GET /api/v1/diagnostics (crosspoint-reader does the same)
  -Wl,--wrap=panic_abort
  ; hw/x4_display.cpp gates the SDK's e-paper BUSY waits: bounded, watchdog-fed, skipped once the panel failed (#181)
  -Wl,--wrap=_ZN7freeink6EpdBus8waitBusyEPKc
  -Wl,--wrap=_ZN7freeink6EpdBus8waitBusyENS_12BusyPolarityEPKc
  -Wl,--wrap=_ZN7freeink6EpdBus19waitRefreshCompleteEPKc
  ; net/wifi_mgr.cpp caps the Wi-Fi driver's dynamic RX/TX buffers (internal RAM, #198); x4qemu unflags it (no Wi-Fi)
  -Wl,--wrap=esp_wifi_init
  -Isrc
  -Iinclude
; -Wall for our src/ only (build_src_flags skips libraries): the vendored SDK and lib/qrcodegen add warnings we don't own.
; Inherited by the x4qemu* envs.
build_src_flags = -Wall
lib_deps =
  BoardConfig=symlink://vendor/freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://vendor/freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://vendor/freeink-sdk/libs/hardware/InputManager
  BatteryMonitor=symlink://vendor/freeink-sdk/libs/hardware/BatteryMonitor
  FrontlightManager=symlink://vendor/freeink-sdk/libs/hardware/FrontlightManager
  ; deep sleep: SoC-correct ext1 wake, rails down, gpio_deep_sleep_hold_en (glance, #10)
  PowerManager=symlink://vendor/freeink-sdk/libs/hardware/PowerManager
  ; BM8563 RTC (keeps time across reboots before NTP) and per-batch panel controller detection
  Rtc=symlink://vendor/freeink-sdk/libs/hardware/Rtc
  XteinkDetect=symlink://vendor/freeink-sdk/libs/hardware/XteinkDetect
  ESP32Async/ESPAsyncWebServer @ 3.12.1
  ESP32Async/AsyncTCP @ 3.5.0
  bblanchon/ArduinoJson @ 7.4.3
test_ignore = *
; `pio check -e x4pro` (cppcheck, CI gate at --fail-on-defect=medium): our src/ only; vendored SDK, libraries,
; framework headers and generated fonts/icons are not ours to fix. Inline suppressions carry their reason.
check_tool = cppcheck
check_src_filters = +<src/> -<src/app/gen/>
check_skip_packages = yes
; low = ~400 style notes (mostly unusedFunction: cppcheck sees one file at a time); not a gate
check_severity = medium, high
check_flags = cppcheck: --inline-suppr --suppress=*:*/vendor/* --suppress=*:*/.pio/*

; Host build: pure core logic (config parser, severity, region diff, API handlers) tested against spec/test-vectors.
[env:native]
platform = native
build_flags = -std=c++17 -Isrc -Iinclude -DX4_NATIVE=1 -DX4_REPO_ROOT=\"${PROJECT_DIR}/..\" -Wall -Wno-unused-function -DARDUINOJSON_STRING_LENGTH_SIZE=4
; core + app UI runtime only — never src/hw/*.cpp, src/net, main.cpp
build_src_filter = -<*> +<core/> +<app/>
lib_deps =
  bblanchon/ArduinoJson @ 7.4.3
lib_compat_mode = off
test_build_src = yes

; Real firmware under Espressif QEMU (`make qemu`, docs/ESP32_EMULATION.md §5). Same image as x4pro except:
; Serial on UART0 (QEMU drops USB-Serial-JTAG), the vendored open_eth driver instead of Wi-Fi (net/wifi_mgr.cpp,
; reported as SSID "QEMU-ETH"), and hw/qemu_hw.cpp (framebuffer-keeping null display, scripted input, no I2C/LEDC)
; instead of hw/x4_*.cpp. Debug endpoints: GET /__qemu/framebuffer.pgm, POST /__qemu/input, GET /__qemu/state.
[env:x4qemu]
extends = env:x4pro
build_unflags =
  -std=gnu++11
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wl,--wrap=esp_wifi_init
  -DX4_OTA_REPO=\"daangeijs/ha-paper\"
build_flags =
  ${env:x4pro.build_flags}
  -UARDUINO_USB_CDC_ON_BOOT
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DX4_QEMU=1
  ; QEMU/CI never calls api.github.com: update checks off, as in a fork's "[YOU]" build
  -DX4_OTA_REPO=\"[YOU]/ha-paper\"
  -DCONFIG_ETH_USE_OPENETH=1
  -DCONFIG_ETH_OPENETH_DMA_RX_BUFFER_NUM=4
  -DCONFIG_ETH_OPENETH_DMA_TX_BUFFER_NUM=1
  ; hw/qemu_tls.cpp: also trust sim/qemu/tls's test CA (the contract suite's https fake HA, #79)
  -Wl,--wrap=esp_crt_bundle_attach
  ; hw/qemu_hw.cpp: esp_restart's two CPU resets become one system reset; QEMU can merge them into a PRO-only reset (#245)
  -Wl,--wrap=esp_rom_software_reset_cpu
build_src_filter = +<*> -<hw/x4_board.cpp> -<hw/x4_display.cpp>
; No panel/input/gauge/front-light libs: InputManager's analogRead() links IDF's ADC self-calibration constructor,
; which spins forever on QEMU's unimplemented SAR ADC before setup() runs.
lib_deps =
  BoardConfig=symlink://vendor/freeink-sdk/libs/hardware/BoardConfig
  ESP32Async/ESPAsyncWebServer @ 3.12.1
  ESP32Async/AsyncTCP @ 3.5.0
  bblanchon/ArduinoJson @ 7.4.3
  qemu_openeth=symlink://../sim/qemu/lib/qemu_openeth

; Test-only "broken update" for sim/qemu/ota-fw-test.sh: resets before the image is confirmed → bootloader rollback.
[env:x4qemu_crashtest]
extends = env:x4qemu
build_flags =
  ${env:x4qemu.build_flags}
  -DX4_TEST_CRASH_ON_BOOT

; Test-only "hung update": network up, loop() never runs → not confirmed → OTA guard restarts (30 s here) → rollback.
[env:x4qemu_hangtest]
extends = env:x4qemu
build_flags =
  ${env:x4qemu.build_flags}
  -DX4_TEST_HANG_ON_BOOT
  -DX4_OTA_GUARD_MS=30000

; Test-only "hung confirmed image" for sim/qemu/wdt-test.sh: loop() hangs 20 s after boot; QEMU's MWDT does not count,
; so after 31 s the image checks the TWDT reports loopTask and resets as TASK_WDT itself (docs/ESP32_EMULATION.md).
[env:x4qemu_wdttest]
extends = env:x4qemu
build_flags =
  ${env:x4qemu.build_flags}
  -DX4_TEST_WDT_HANG

; QEMU soak/debug image (#39, docs/ESP32_EMULATION.md): `make qemu-contract QEMU_ENV=x4qemu_debug`. The prebuilt Arduino
; libs already have stack canaries + end-of-stack watchpoint, light heap poisoning, stack protector and asserts (no
; sdkconfig change without rebuilding them); this adds -fstack-protector-strong for src/, a critical-section tracer
; that checks every spinlock on enter/exit and a 10 s heap integrity check (hw/qemu_debug.cpp).
[env:x4qemu_debug]
extends = env:x4qemu
build_flags =
  ${env:x4qemu.build_flags}
  -DX4_QEMU_DEBUG=1
  -Wl,--wrap=xPortEnterCriticalTimeout
  -Wl,--wrap=vPortExitCritical
build_src_flags = -Wall -fstack-protector-strong
