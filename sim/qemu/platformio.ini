; QEMU smoke-test project for the X4 firmware platform (ESP32-S3, pioarduino Arduino 3.3 / IDF 5.5).
; Independent PlatformIO project so it never touches firmware/platformio.ini.
; Build:  cd sim/qemu && ../../.venv/bin/pio run          (or: sim/qemu/run.sh --build)
; Run:    sim/qemu/run.sh                                   (see docs/ESP32_EMULATION.md)
[platformio]
default_envs = qemu

[env:qemu]
; Same platform/board/flash layout as firmware env:x4pro
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = ../../firmware/partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = dio_opi
build_flags =
  ; QEMU stubs USB-Serial-JTAG (writes go nowhere) -> Serial must be UART0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=3
  -DX4_QEMU=1
  ; Enable the vendored OpenCores Ethernet driver (lib/qemu_openeth). Not in the precompiled IDF libs.
  -DCONFIG_ETH_USE_OPENETH=1
  -DCONFIG_ETH_OPENETH_DMA_RX_BUFFER_NUM=4
  -DCONFIG_ETH_OPENETH_DMA_TX_BUFFER_NUM=1
